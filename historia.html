<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NebWort — Modo história</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="faixa-topo">
    <div class="marca"><span class="mark">N</span> NebWort</div>
    <div class="info-usuario">
      <span class="titulo-pill" id="tituloPill">—</span>
      <span class="pontos-pill"><span id="pontosAtuais">0</span> pts</span>
    </div>
  </header>

  <main class="container-principal">
    <div class="cartao cartao-largo">
      <span class="eyebrow">Trilha</span>
      <h1>Modo história</h1>
      <p>
        Nove temas, cinco capítulos cada.
        Conclua o atual para liberar o próximo.
      </p>

      <div class="historia-progresso">
        Progresso: <strong id="progressoHistoria">0 / 45</strong>
      </div>

      <div id="historiaCompleta" class="mensagem-aviso oculto" style="margin-top: 12px;">
        Você concluiu toda a trilha. Pode rejogar qualquer capítulo.
      </div>

      <div id="listaTemas" class="lista-temas"></div>

      <div class="linha-botoes" style="margin-top: 22px; border-top: 3px solid var(--border); padding-top: 18px;">
        <a href="pagina2.html" class="botao botao-secundario">Voltar</a>
        <a href="ranking.html" class="botao botao-secundario">Ranking</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script type="module">
    import { TEMAS_HISTORIA, TOTAL_SUBS } from "./capitulos-data.js";

    const nickname = exigirLogin();
    if (!nickname) throw new Error("login");

    definirModo("historia");

    const pontos = obterPontosUsuario(nickname);
    const titulo = obterTituloPorPontos(pontos);
    const liberado = obterCapituloHistoria(nickname);

    const elPontos = document.getElementById("pontosAtuais");
    if (elPontos) elPontos.textContent = pontos;

    const elTitulo = document.getElementById("tituloPill");
    if (elTitulo) elTitulo.textContent = `${titulo.emoji} ${titulo.nome}`;

    const elProgresso = document.getElementById("progressoHistoria");
    if (elProgresso) {
      elProgresso.textContent = `${Math.min(liberado, TOTAL_SUBS)} / ${TOTAL_SUBS}`;
    }

    if (liberado >= TOTAL_SUBS) {
      const fim = document.getElementById("historiaCompleta");
      if (fim) fim.classList.remove("oculto");
    }

    const container = document.getElementById("listaTemas");
    if (!container) throw new Error("lista");

    const emojisTema = ["🦁", "🍲", "🌿", "💼", "⚽", "💻", "💭", "🚀", "📜"];

    TEMAS_HISTORIA.forEach((tema, temaIdx) => {
      const bloco = document.createElement("div");
      bloco.className = "tema-bloco";

      const feitosNoTema = tema.subs.filter((_, sIdx) => {
        const global = temaIdx * 5 + sIdx;
        return global < liberado;
      }).length;

      const emoji = emojisTema[temaIdx] || "📘";

      bloco.innerHTML = `
        <div class="tema-cabecalho">
          <div>
            <strong>${emoji} ${escaparHtml(tema.nome)}</strong>
            <span class="capitulo-tema">${escaparHtml(tema.descricao)}</span>
          </div>
          <span class="tema-contador">${feitosNoTema}/5</span>
        </div>
        <div class="tema-subs"></div>
      `;

      const subsEl = bloco.querySelector(".tema-subs");

      tema.subs.forEach((sub, subIdx) => {
        const global = temaIdx * 5 + subIdx;
        const bloqueado = global > liberado;
        const concluido = global < liberado;
        const atual = global === liberado && liberado < TOTAL_SUBS;

        const item = document.createElement("div");
        item.className = "capitulo-item" +
          (bloqueado ? " capitulo-bloqueado" : "") +
          (concluido ? " capitulo-concluido" : "") +
          (atual ? " capitulo-atual" : "");

        let status = "🔒";
        let numLabel = String(subIdx + 1);
        if (concluido) { status = "Feito"; numLabel = "✓"; }
        else if (atual) status = "Jogar";

        item.innerHTML = `
          <div class="capitulo-num">${numLabel}</div>
          <div class="capitulo-info">
            <strong>${escaparHtml(sub.nome)}</strong>
            <span class="capitulo-tema">${escaparHtml(sub.tema)}</span>
          </div>
          <div class="capitulo-status">${status}</div>
        `;

        if (!bloqueado) {
          item.addEventListener("click", () => {
            definirModo("historia");
            definirCapituloSessao(global);
            window.location.href = `historia-fase.html?sub=${global}`;
          });
        }

        subsEl.appendChild(item);
      });

      container.appendChild(bloco);
    });
  </script>
</body>
</html>
