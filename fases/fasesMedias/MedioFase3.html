<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NebWort — Médio · Fase 3 · Tecnologia</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <header class="faixa-topo">
    <div class="marca"><span class="mark">N</span> NebWort</div>
    <div class="info-usuario">
      <span class="pontos-pill"><span id="pontosAtuais">0</span> pts</span>
    </div>
  </header>
  <main class="container-principal">
    <div class="cartao cartao-largo">
      <span class="eyebrow">Médio · Fase 3 de 3 · Tecnologia</span>
      <h1>Relaciona com a palavra</h1>
      <div class="arena">
        <div class="nucleo-palavra"><span id="palavraSorteada">...</span></div>
        <div class="dica-quantidade">Digite 4 palavra(s), separadas por vírgula</div>
        <div class="estado-modelo" id="estadoModelo">
          <span class="espiral"></span>
          <span id="textoEstadoModelo">Carregando modelo semântico...</span>
        </div>
        <div class="mensagem-aviso oculto" id="avisoFallback">
          O modelo semântico não pôde ser carregado. O jogo continua pontuando pelo tamanho das palavras.
        </div>
        <form id="formResposta" class="campo-resposta" novalidate>
          <label for="campoResposta">Suas respostas</label>
          <input type="text" id="campoResposta" placeholder="palavra1, palavra2, palavra3, palavra4" autocomplete="off" />
          <div class="linha-botoes">
            <button type="submit" id="botaoEnviar" class="botao botao-primario">Enviar</button>
            <button type="button" id="botaoProxima" class="botao botao-secundario" disabled>Ver ranking</button>
          </div>
        </form>
        <div class="constelacao-respostas" id="constelacaoRespostas"></div>
        <div class="resumo-rodada oculto" id="resumoRodada"></div>
      </div>
      <div class="linha-botoes" style="margin-top: 24px; border-top: 3px solid var(--border); padding-top: 18px;">
        <a href="../../pagina3.html" class="botao botao-secundario">Dificuldade</a>
        <a href="../../ranking.html" class="botao botao-secundario">Ranking</a>
      </div>
    </div>
  </main>
  <script>const CAMINHO_RAIZ = "../../";</script>
  <script src="../../script.js"></script>
  <script type="module">
    import { iniciarFase } from "../../fase-engine.js";
    iniciarFase({
      palavras: ["computador", "internet", "celular", "robo", "satelite", "software", "bateria", "teclado"],
      quantidade: 4,
      proximaHref: "",
    });
  </script>
</body>
</html>
