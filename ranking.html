<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NebWort — Ranking</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="faixa-topo">
    <div class="marca"><span class="ponto"></span> NebWort</div>
    <div class="info-usuario">
      <button id="botaoSair" class="botao botao-perigo">Sair</button>
    </div>
  </header>

  <main class="container-principal">
    <div class="cartao cartao-largo">
      <span class="eyebrow">Placar</span>
      <h1>Ranking</h1>
      <p>Pontos e títulos. Sua linha fica destacada.</p>

      <table class="tabela-ranking">
        <thead>
          <tr>
            <th>#</th>
            <th>Nickname</th>
            <th>Título</th>
            <th style="text-align:right;">Pontos</th>
          </tr>
        </thead>
        <tbody id="corpoTabelaRanking"></tbody>
      </table>

      <div class="legenda-titulos">
        <span>🌱 Aprendiz</span>
        <span>🔗 Conector (50+)</span>
        <span>✨ Semântico (150+)</span>
        <span>🌌 Constelação (350+)</span>
        <span>👑 Mestre (700+)</span>
      </div>

      <div class="linha-botoes" style="margin-top: 24px;">
        <a href="pagina2.html" class="botao botao-secundario">Início</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    iniciarRanking();
  </script>
</body>
</html>
